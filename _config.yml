theme: jekyll-theme-chirpy

# ====================
# Site Settings
# ====================
lang: en
timezone: Asia/Seoul

title: Jangkyu Ju
tagline: Ph.D. Student in Computer Science | Human-AI Interaction & Information Visualization
description: >-
  Ph.D. student in Computer Science at the Georgia Institute of Technology,
  researching human-AI interaction, AI interface design, information visualization,
  and trust in AI-enabled systems.

# GitHub Pages URL - update before deploying
# For username.github.io repo: url = "https://USERNAME.github.io", baseurl = ""
# For project repo: url = "https://USERNAME.github.io", baseurl = "/REPO-NAME"
url: "https://jangkyuju.github.io"
baseurl: ""

# ====================
# Social / Profile
# ====================
github:
  username: jangkyuju

social:
  name: Jangkyu Ju
  email: jju39@gatech.edu
  links:
    - https://www.linkedin.com/in/jangkyu-ju-99666724a/
    - https://github.com/jangkyuju
    - https://scholar.google.com/citations?user=qA_-6TQAAAAJ

# Add a real image path when a profile photo is available.
avatar: /assets/img/yosemite_image_renew.jpg
social_preview_image: /assets/img/social-preview.png

# ====================
# Theme Settings
# ====================
# The site is intentionally light-only.
theme_mode: light

# Sidebar (Chirpy default) - we override with top navbar in _layouts/default.html
# Keep these for SEO / meta purposes
icon:

# ====================
# Analytics
# ====================
analytics:
  google:
    id: "G-JQ6PJW9F7H"   # GA4 Measurement ID
    dashboard_url: "https://datastudio.google.com/embed/reporting/f5cc2814-c167-467e-9d71-725e5ccb4066/page/i8q3F"     # Looker Studio embed URL for Portfolio Analytics

# ====================
# Comments (disabled)
# ====================
comments:
  provider: ""

# ====================
# Blog Settings (Chirpy)
# ====================
paginate: 5

# Blog categories
# (defined via post front matter)

# Table of Contents
toc: true

# ====================
# Markdown & Syntax
# ====================
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true

# ====================
# Collections & Defaults
# ====================
include:
  - _pages

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: blog-doc
      comments: false
      toc: true
      math: false
      mermaid: false
  - scope:
      path: _pages
      type: pages
    values:
      layout: page

# ====================
# Assets & Compression
# ====================
sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: development

# ====================
# Plugins
# ====================
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# ====================
# Exclude from build
# ====================
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - output
  - tools
  - README.md
  - LICENSE
  - "*.zip"
  - package.json
  - package-lock.json
  - DEVELOPMENT.md
  - scripts
  - agent-design.md
  - CLAUDE.md
  - AGENTS.md
  - SECURITY.md
  - .claude
  - vendor
  - node_modules
  - SUMMARY.md
