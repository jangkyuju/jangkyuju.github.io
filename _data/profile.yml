# Bio paragraphs (supports HTML)
bio:
  - >
    I am a Ph.D. student in
    <a href="https://www.cc.gatech.edu/degree-programs/phd-computer-science" target="_blank" rel="noopener noreferrer" class="text-link">Computer Science</a>
    at the <a href="https://www.gatech.edu/" target="_blank" rel="noopener noreferrer" class="text-link">Georgia Institute of Technology</a>,
    affiliated with the School of Interactive Computing. I am a Graduate Student Researcher in the
    <a href="https://vis.gatech.edu/" target="_blank" rel="noopener noreferrer" class="text-link">GT Visualization Lab</a>,
    advised by <a href="https://cyxiong.com/" target="_blank" rel="noopener noreferrer" class="text-link">Cindy Xiong Bearfield</a>.
  - >
    My research centers on <strong>human-AI interaction</strong> and
    <strong>AI interface design</strong>, with a particular interest in how
    <strong>information visualization</strong> choices shape people's cognition,
    perception, and trust when they interact with AI systems.
  - >
    Before joining Georgia Tech, I worked at Hyundai Motor Group as a Data Scientist
    and Research Engineer, focusing on large-scale user behavior analysis, metrics and
    dashboard development, machine learning, and personalized in-vehicle interfaces.
    I hold an M.S. in Behavioral and Cognitive Neuroscience from
    <a href="https://psychology.korea.ac.kr" target="_blank" rel="noopener noreferrer" class="text-link">Korea University</a>.

